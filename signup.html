<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — VOLTARA</title>
  <meta name="description" content="Register as a customer to book electronics services or apply as a verified host laboratory provider.">
  
  <!-- Favicon matching Navbar Brand Icon exactly -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between position-relative">

  <!-- Top Right Floating Theme Toggle -->
  <button type="button" class="theme-toggle-btn auth-theme-toggle" aria-label="Toggle theme" title="Toggle theme">
    <i class="bi bi-sun-fill text-warning"></i>
  </button>

  <!-- Signup Main Card (No Navbar, Centered Box) -->
  <main class="py-5 flex-grow-1 d-flex align-items-center justify-content-center px-3">
    <div class="max-w-480 w-100 mx-auto">
      <div class="voltara-card bg-surface-elevated p-4 p-sm-5 border border-subtle rounded-4 shadow-lg">
        
        <!-- Brand Name & Logo Inside Box Top Center -->
        <div class="text-center mb-4">
          <a href="index.html" class="brand-logo justify-content-center mb-3 text-decoration-none" aria-label="Voltara Home">
            <div class="brand-symbol">
              <i class="bi bi-cpu-fill"></i>
            </div>
            <span class="brand-text">VOLTARA</span>
          </a>
          <h1 class="font-heading fw-bold fs-3 mb-1">Create Your Account</h1>
          <p class="text-secondary small mb-0">Join the premium electronics marketplace and booking network.</p>
        </div>

        <!-- Account Type Segmented Toggle -->
        <div class="mb-4">
          <label class="input-label-custom text-center mb-2">Select Account Type</label>
          <div class="row g-2">
            <div class="col-6">
              <label class="d-flex flex-column align-items-center p-3 rounded-3 bg-surface-subtle border border-subtle cursor-pointer text-center h-100">
                <input type="radio" name="accountRole" id="roleCustomer" value="customer" class="form-check-input custom-check mb-2" checked>
                <span class="fw-bold small text-primary-emphasis">Customer</span>
                <span class="small text-muted" style="font-size: 0.72rem;">Book services & track repairs</span>
              </label>
            </div>
            <div class="col-6">
              <label class="d-flex flex-column align-items-center p-3 rounded-3 bg-surface-subtle border border-subtle cursor-pointer text-center h-100">
                <input type="radio" name="accountRole" id="roleHost" value="host" class="form-check-input custom-check mb-2">
                <span class="fw-bold small text-primary-emphasis">Host / Provider</span>
                <span class="small text-muted" style="font-size: 0.72rem;">Offer cleanroom benches & vans</span>
              </label>
            </div>
          </div>
        </div>

        <form id="voltaraSignupForm">
          <div class="d-flex flex-column gap-3 mb-3">
            <!-- Full Legal Name (Separate Line) -->
            <div>
              <label class="input-label-custom" for="signupName">Full Legal Name <span class="text-danger">*</span></label>
              <input type="text" id="signupName" class="form-control-custom" placeholder="e.g. Marcus Brody" required autocomplete="name">
            </div>

            <!-- Email Address (Separate Line) -->
            <div>
              <label class="input-label-custom" for="signupEmail">Email Address <span class="text-danger">*</span></label>
              <input type="email" id="signupEmail" class="form-control-custom" placeholder="name@domain.com" required autocomplete="email">
            </div>

            <!-- Phone Number (Separate Line) -->
            <div>
              <label class="input-label-custom" for="signupPhone">Phone Number</label>
              <input type="tel" id="signupPhone" class="form-control-custom" placeholder="+1 (555) 000-0000" autocomplete="tel">
            </div>

            <!-- Host specific optional fields (Separate Lines) -->
            <div id="hostSignupFields" class="d-none">
              <div class="p-3 rounded-3 bg-surface-subtle border border-subtle d-flex flex-column gap-3">
                <div>
                  <label class="input-label-custom">Business / Lab Name</label>
                  <input type="text" class="form-control-custom" placeholder="e.g. Apex Tech Labs">
                </div>
                <div>
                  <label class="input-label-custom">Cleanroom / Mobile Facility Type</label>
                  <select class="form-select-custom">
                    <option value="lab">Fixed Cleanroom Service Lab</option>
                    <option value="van">On-Demand Mobile Van</option>
                    <option value="indie">Independent Master Specialist</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Password Field (Separate Line) -->
            <div>
              <label class="input-label-custom" for="signupPassword">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="password" id="signupPassword" class="form-control form-control-custom" placeholder="••••••••" required autocomplete="new-password">
                <button type="button" class="btn btn-outline-secondary password-toggle-btn border-medium" aria-label="Toggle password visibility">
                  <i class="bi bi-eye-fill"></i>
                </button>
              </div>
            </div>

            <!-- Confirm Password Field (Separate Line) -->
            <div>
              <label class="input-label-custom" for="signupConfirmPassword">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="password" id="signupConfirmPassword" class="form-control form-control-custom" placeholder="••••••••" required autocomplete="new-password">
                <button type="button" class="btn btn-outline-secondary password-toggle-btn border-medium" aria-label="Toggle confirm password visibility">
                  <i class="bi bi-eye-fill"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="form-check mb-4 small text-secondary">
            <input class="form-check-input" type="checkbox" id="signupTerms" required checked>
            <label class="form-check-label" for="signupTerms">
              I agree to the <a href="about.html" class="text-primary">Voltara Terms of Service</a> & 25% Escrow Protection Policy.
            </label>
          </div>

          <button type="submit" class="btn-voltara-primary w-100 py-3 justify-content-center fs-6 mb-3">
            <i class="bi bi-person-plus-fill"></i> Create Account
          </button>
        </form>

        <div class="text-center my-3 position-relative">
          <hr class="border-subtle my-0">
          <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface-elevated small text-muted">OR</span>
        </div>

        <!-- Google & Apple Social Sign Up in Bottom -->
        <div class="d-flex gap-2 mb-4">
          <button type="button" class="social-login-btn flex-grow-1" onclick="VoltaraToast.show({ title: 'Google OAuth', message: 'Connecting with Google...', type: 'info' })">
            <i class="bi bi-google text-danger"></i> Google
          </button>
          <button type="button" class="social-login-btn flex-grow-1" onclick="VoltaraToast.show({ title: 'Apple ID', message: 'Connecting with Apple ID...', type: 'info' })">
            <i class="bi bi-apple"></i> Apple
          </button>
        </div>

        <div class="text-center small text-secondary">
          Already have an account? <a href="login.html" class="text-primary fw-semibold">Sign In</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Auth Footer -->
  <footer class="py-3 border-top border-subtle text-center small text-muted">
    <div class="container-custom">
      © 2026 VOLTARA Inc. • <a href="index.html" class="text-secondary">Home</a> • <a href="about.html" class="text-secondary">About</a> • <a href="explore.html" class="text-secondary">Services</a> • <a href="contact.html" class="text-secondary">Contact</a>
    </div>
  </footer>

  <!-- Back to Top Button -->
  <button type="button" class="voltara-back-to-top" id="voltaraBackToTop" aria-label="Back to top">
    <i class="bi bi-arrow-up-short"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
