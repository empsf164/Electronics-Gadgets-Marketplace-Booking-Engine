<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VOLTARA Marketplace</title>
  <meta name="description" content="Sign in to your VOLTARA account to track laboratory bench queues and view service history.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

  <!-- Minimal Header -->
  <header class="py-3 border-bottom border-subtle">
    <div class="container-custom d-flex justify-content-between align-items-center">
      <a href="index.html" class="brand-logo" aria-label="Voltara Home">
        <div class="brand-symbol"><i class="bi bi-cpu-fill"></i></div>
        <div class="d-flex align-items-center">
          <span class="brand-text">VOLTARA</span>
          <span class="brand-tag">AUTH</span>
        </div>
      </a>

      <div class="d-flex align-items-center gap-3">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle theme">
          <i class="bi bi-sun-fill text-warning"></i>
        </button>
        <a href="signup.html" class="small text-secondary fw-semibold text-decoration-none">Create Account</a>
      </div>
    </div>
  </header>

  <!-- Login Main Card -->
  <main class="py-5 flex-grow-1 d-flex align-items-center">
    <div class="container-custom max-w-500 mx-auto">
      <div class="voltara-card bg-surface-elevated p-4 p-md-5 border border-subtle rounded-4 shadow-lg">
        
        <div class="text-center mb-4">
          <h1 class="font-heading fw-bold fs-3 mb-1">Welcome Back</h1>
          <p class="text-secondary small">Sign in to track real-time bench queue updates and quotes.</p>
        </div>

        <!-- Demo Account Autofill Shortcuts -->
        <div class="p-3 rounded-3 bg-surface-subtle border border-subtle mb-4">
          <div class="small text-muted mb-2 text-uppercase letter-spacing-1 fw-bold" style="font-size: 0.7rem;">Quick Demo Autofill</div>
          <div class="d-flex gap-2">
            <button type="button" id="btnDemoCustomer" class="btn btn-sm btn-outline-primary flex-grow-1">
              <i class="bi bi-person me-1"></i> Customer Demo
            </button>
            <button type="button" id="btnDemoHost" class="btn btn-sm btn-outline-info flex-grow-1">
              <i class="bi bi-shield-check me-1"></i> Host Specialist
            </button>
          </div>
        </div>

        <form id="voltaraLoginForm">
          <div class="mb-3">
            <label class="input-label-custom">Email Address</label>
            <input type="email" id="loginEmail" class="form-control-custom" placeholder="name@domain.com" required>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="input-label-custom mb-0">Password</label>
              <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot password?</a>
            </div>
            <div class="input-group">
              <input type="password" id="loginPassword" class="form-control form-control-custom" placeholder="••••••••" required>
              <button type="button" class="btn btn-outline-secondary password-toggle-btn border-medium" aria-label="Toggle password visibility">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4 small text-secondary">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked>
              <label class="form-check-label" for="rememberMeCheck">Remember on this device</label>
            </div>
          </div>

          <button type="submit" class="btn-voltara-primary w-100 py-3 justify-content-center fs-6 mb-3">
            <i class="bi bi-box-arrow-in-right"></i> Sign In to Voltara
          </button>
        </form>

        <div class="text-center my-3 position-relative">
          <hr class="border-subtle my-0">
          <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface-elevated small text-muted">OR</span>
        </div>

        <button type="button" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 mb-3 rounded-2" onclick="VoltaraToast.show({ title: 'Google OAuth', message: 'Simulating secure single sign-on...', type: 'info' })">
          <i class="bi bi-google"></i> Continue with Google
        </button>

        <div class="text-center small text-secondary">
          Don't have an account? <a href="signup.html" class="text-primary fw-semibold">Sign Up</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 border-top border-subtle text-center small text-muted">
    <div class="container-custom">
      © 2026 VOLTARA Inc. • <a href="index.html" class="text-secondary">Home</a> • <a href="explore.html" class="text-secondary">Explore</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
