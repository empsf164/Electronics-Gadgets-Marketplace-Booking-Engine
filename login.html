<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VOLTARA Marketplace</title>
  <meta name="description"
    content="Sign in to your VOLTARA account to track laboratory bench queues and view service history.">

  <!-- Favicon matching Navbar Brand Icon exactly -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="d-flex flex-column min-vh-100 justify-content-between position-relative">

  <!-- Top Right Floating Theme Toggle -->
  <button type="button" class="theme-toggle-btn auth-theme-toggle" aria-label="Toggle theme" title="Toggle theme">
    <i class="bi bi-sun-fill text-warning"></i>
  </button>

  <!-- Login Main Card (No Navbar, Centered Box) -->
  <main class="py-5 flex-grow-1 d-flex align-items-center justify-content-center px-3">
    <div class="max-w-440 w-100 mx-auto">
      <div class="voltara-card bg-surface-elevated p-4 p-sm-5 border border-subtle rounded-4 shadow-lg">

        <!-- Brand Name & Logo Inside Box Top Center -->
        <div class="text-center mb-4">
          <a href="index.html" class="brand-logo justify-content-center mb-3 text-decoration-none" aria-label="Voltara Home">
            <div class="brand-symbol">
              <i class="bi bi-cpu-fill"></i>
            </div>
            <span class="brand-text">VOLTARA</span>
          </a>
          <h1 class="font-heading fw-bold fs-3 mb-1">Welcome Back</h1>
          <p class="text-secondary small mb-0">Sign in to track real-time bench queue updates and quotes.</p>
        </div>

        <!-- Demo Account Autofill Shortcuts -->
        <div class="p-3 rounded-3 bg-surface-subtle border border-subtle mb-4">
          <div class="small text-muted mb-2 text-uppercase letter-spacing-1 fw-bold" style="font-size: 0.7rem;">Quick Demo Autofill</div>
          <div class="d-flex gap-2">
            <button type="button" id="btnDemoCustomer" class="btn btn-sm btn-outline-primary flex-grow-1">
              <i class="bi bi-person me-1"></i> Customer Demo
            </button>
            <button type="button" id="btnDemoHost" class="btn btn-sm btn-outline-info flex-grow-1">
              <i class="bi bi-shield-check me-1"></i> Host Specialist
            </button>
          </div>
        </div>

        <form id="voltaraLoginForm">
          <!-- Email Field (Separate Line) -->
          <div class="mb-3">
            <label class="input-label-custom" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control-custom" placeholder="name@domain.com" required autocomplete="email">
          </div>

          <!-- Password Field (Separate Line) -->
          <div class="mb-3">
            <label class="input-label-custom" for="loginPassword">Password</label>
            <div class="input-group">
              <input type="password" id="loginPassword" class="form-control form-control-custom" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="btn btn-outline-secondary password-toggle-btn border-medium" aria-label="Toggle password visibility">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me and Forgot Password on Same Line -->
          <div class="d-flex justify-content-between align-items-center mb-4 small text-secondary">
            <div class="form-check mb-0 d-flex align-items-center gap-2">
              <input class="form-check-input mt-0" type="checkbox" id="rememberMeCheck" checked>
              <label class="form-check-label cursor-pointer" for="rememberMeCheck">Remember me</label>
            </div>
            <a href="forgot-password.html" class="small text-primary text-decoration-none fw-semibold">Forgot password?</a>
          </div>

          <button type="submit" class="btn-voltara-primary w-100 py-3 justify-content-center fs-6 mb-3">
            <i class="bi bi-box-arrow-in-right"></i> Sign In to Voltara
          </button>
        </form>

        <div class="text-center my-3 position-relative">
          <hr class="border-subtle my-0">
          <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface-elevated small text-muted">OR</span>
        </div>

        <!-- Google & Apple Social Login in Bottom -->
        <div class="d-flex gap-2 mb-4">
          <button type="button" class="social-login-btn flex-grow-1" onclick="VoltaraToast.show({ title: 'Google OAuth', message: 'Simulating secure single sign-on...', type: 'info' })">
            <i class="bi bi-google text-danger"></i> Google
          </button>
          <button type="button" class="social-login-btn flex-grow-1" onclick="VoltaraToast.show({ title: 'Apple ID', message: 'Simulating Apple ID sign-in...', type: 'info' })">
            <i class="bi bi-apple"></i> Apple
          </button>
        </div>

        <div class="text-center small text-secondary">
          Don't have an account? <a href="signup.html" class="text-primary fw-semibold">Sign Up</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Auth Footer -->
  <footer class="py-3 border-top border-subtle text-center small text-muted">
    <div class="container-custom">
      © 2026 VOLTARA Inc. • <a href="index.html" class="text-secondary">Home</a> • <a href="about.html" class="text-secondary">About</a> • <a href="explore.html" class="text-secondary">Services</a> • <a href="contact.html" class="text-secondary">Contact</a>
    </div>
  </footer>

  <!-- Back to Top Button -->
  <button type="button" class="voltara-back-to-top" id="voltaraBackToTop" aria-label="Back to top">
    <i class="bi bi-arrow-up-short"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
